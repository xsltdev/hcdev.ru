site_name: HTML и CSS
site_url: https://hcdev.ru/
site_description: Справочник HTML и CSS с примерами кода
site_author: hcdev.ru
copyright: (☭) Народное достояние с 2021 года

repo_name: 'Справочник на Github'
repo_url: 'https://github.com/xsltdev/hcdev.ru'

theme:
    name: materialx
    custom_dir: overrides
    topbar_style: primary
    palette:
        - media: '(prefers-color-scheme)'
          primary: red
          accent: red
          toggle:
              icon: material/brightness-auto
              name: Переключиться на светлую тему
        - media: '(prefers-color-scheme: light)'
          scheme: default
          primary: red
          accent: red
          toggle:
              icon: material/toggle-switch-off-outline
              name: Переключиться на тёмную тему
        - media: '(prefers-color-scheme: dark)'
          scheme: slate
          primary: red
          accent: red
          toggle:
              icon: material/toggle-switch
              name: Переключиться на системную тему
    language: ru
    features:
        - navigation.prune
        - navigation.tabs
        - navigation.tracking
        - navigation.top
        - navigation.footer
        - navigation.indexes
        - navigation.path
        - content.action.edit
        - content.code.copy
    favicon: html.svg
    logo: html.svg

extra:
    generator: false
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/xsltdev
          name: GitHub
        - icon: fontawesome/regular/heart
          link: https://boosty.to/bndby
          name: Boosty
        - icon: fontawesome/brands/linkedin
          link: https://www.linkedin.com/in/bndby/
          name: LinkedIn
    analytics:
        provider: google
        property: G-898K4P2DB8

markdown_extensions:
    - admonition
    - toc:
          permalink: true
    - pymdownx.extra
    - pymdownx.critic
    - pymdownx.caret
    - pymdownx.keys
    - pymdownx.mark
    - pymdownx.tilde
    - pymdownx.details
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.highlight:
          pygments_lang_class: true
          linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
    - pymdownx.arithmatex:
          generic: true
    - pymdownx.smartsymbols

plugins:
    - search:
          lang:
              - ru
              - en
    - awesome-pages
    - social
    - minify:
          minify_html: true
          htmlmin_opts:
              remove_comments: true
          cache_safe: true
    - glightbox:
          auto_caption: true
          skip_classes:
              - nolightbox
    - mkdocs-video

extra_javascript:
    - 'https://cdn.jsdelivr.net/gh/ireade/caniuse-embed/public/caniuse-embed.min.js'
    - '/assets/js/bndby-browser-compat.js?1'

extra_css:
    - '/assets/stylesheets/styles.css?11'
